<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PocketSmart AI — AI-Powered Personal Budget & Planning Assistant{% endblock %}</title>
  <meta name="description" content="AI-powered budget planning and recommendation assistant for Home Interior, Party Planning, and Jewelry Styling using Google Gemini.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/cartoon-effects.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Toast Notification Container -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- Reusable Result Modal -->
  <div id="resultModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="result-modal">
      <button class="modal-close" data-close-modal aria-label="Close dialog">×</button>
      <div id="resultContent"></div>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="/js/auth.js"></script>
  <script src="/js/planner.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/history.js"></script>
  <script src="/js/app.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
